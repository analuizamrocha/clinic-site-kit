name: Starter app

on:
  pull_request:
    paths: ['templates/next-app/**', 'examples/**', '.github/workflows/starter.yml']
  push:
    branches: [main]
    paths: ['templates/next-app/**', '.github/workflows/starter.yml']

jobs:
  check:
    name: typecheck · lint · unit · build · e2e
    # Pinned: Playwright does not support Chromium on ubuntu 26.04 yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: templates/next-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: templates/next-app/.nvmrc
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: templates/next-app/test-results

  generate:
    name: generate a site from the example brief
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: templates/next-app/.nvmrc
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: templates/next-app
      - run: bunx playwright install --with-deps chromium
        working-directory: templates/next-app
      - name: create-site --check (brief → repo → typecheck, lint, unit, build, e2e)
        working-directory: templates/next-app
        run: bun scripts/create-site.ts --brief ../../examples/demo-pediatria/client.json --out "$RUNNER_TEMP/demo-site" --check
